upstream earmuff_api {
    server api:8080;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 同源代理：浏览器只访问本容器，/api 转发到 Go 服务。
    location /api/ {
        proxy_pass         http://earmuff_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass         http://earmuff_api/health;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
